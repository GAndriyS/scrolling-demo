<app-header />

<div class="layout">
  <div class="column">
    <app-users
      [users]="filteredUsers()"
      [selectedIds]="store.usersSelected()"
      [totalCount]="totalUserCount"
    />
  </div>
  <div class="column">
    <app-posts
      [posts]="filteredPosts()"
      [totalCount]="totalPostCount"
    />
  </div>
</div>
